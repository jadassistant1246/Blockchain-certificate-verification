<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - BlockCert</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 35px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .required {
            color: #dc2626;
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .register-btn {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .flash-messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .form-container {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="header">
        <h1>Student Registration</h1>
        <p>Create your BlockCert student account</p>
    </div>

    <div class="form-container">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="section-title">
            Student Information
        </div>

        <!-- Registration Form -->
        <form action="{{ url_for('student_register') }}" method="POST">

            <div class="form-grid">

                <!-- Student Name -->
                <div class="form-group">
                    <label>
                        Student Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="student_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label>
                        Email Address <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter phone number"
                        maxlength="20"
                    >
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label>
                        Department
                    </label>

                    <input
                        type="text"
                        name="department"
                        placeholder="Example: Computer Science"
                    >
                </div>

                <!-- Course -->
                <div class="form-group">
                    <label>
                        Course
                    </label>

                    <input
                        type="text"
                        name="course"
                        placeholder="Example: B.Tech Computer Engineering"
                    >
                </div>

                <!-- Enrollment Number -->
                <div class="form-group">
                    <label>
                        Enrollment Number
                    </label>

                    <input
                        type="text"
                        name="enrollment_no"
                        placeholder="Enter enrollment number"
                    >
                </div>

                <!-- Admission Year -->
                <div class="form-group">
                    <label>
                        Admission Year
                    </label>

                    <input
                        type="number"
                        name="admission_year"
                        placeholder="Example: 2024"
                        min="2000"
                        max="2100"
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>
                        Password <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

            </div>

            <div class="button-container">
                <button type="submit" class="register-btn">
                    Create Student Account
                </button>
            </div>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('student_login') }}">
                Student Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
